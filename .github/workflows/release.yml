name: Signed release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MUSICCUT_RELEASE_KEYSTORE: ${{ runner.temp }}/musiccut-release.jks
      MUSICCUT_RELEASE_STORE_PASSWORD: ${{ secrets.MUSICCUT_RELEASE_STORE_PASSWORD }}
      MUSICCUT_RELEASE_KEY_ALIAS: ${{ secrets.MUSICCUT_RELEASE_KEY_ALIAS }}
      MUSICCUT_RELEASE_KEY_PASSWORD: ${{ secrets.MUSICCUT_RELEASE_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.MUSICCUT_RELEASE_KEYSTORE_B64 }}
      VERSION_NAME: ${{ inputs.version }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release inputs and load signing key
        shell: bash
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version format"; exit 1; }
          test -n "$KEYSTORE_B64" || { echo "Missing keystore secret"; exit 1; }
          test -n "$MUSICCUT_RELEASE_STORE_PASSWORD" || exit 1
          test -n "$MUSICCUT_RELEASE_KEY_ALIAS" || exit 1
          test -n "$MUSICCUT_RELEASE_KEY_PASSWORD" || exit 1
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$MUSICCUT_RELEASE_KEYSTORE"
          test -s "$MUSICCUT_RELEASE_KEYSTORE"
      - name: Run tests and build signed release
        run: ./gradlew :core:test :app:assembleRelease --stacktrace
      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MusicCut-${VERSION_NAME}.apk"
          sha256sum "MusicCut-${VERSION_NAME}.apk" > "MusicCut-${VERSION_NAME}.apk.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MusicCut v${{ inputs.version }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            MusicCut-*.apk
            MusicCut-*.apk.sha256
